[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-map-public"
version = "0.1.0"
description = "Standalone GeoJSON validation and safe depthmapXcli helpers for urban analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Urban Map Team" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
